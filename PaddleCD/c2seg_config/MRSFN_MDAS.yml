_base_: 'MDAS.yml'

# MRSFN (full), equivalent to cxup_4b_AB_PMRG_ML on the AB dataset.
model:
  type: CX_Uper_4B_PMRG_V2
  backb: convnext_tiny
  in_channels: 3
  num_classes: 14
  dropout_rate: 0
  hsi_chs: 242

loss:
  types:
    - type: MixedLoss
      losses:
        - type: Poly1Loss_Smooth
        - type: DiceLoss
      coef: [1, 0.5]
  coef: [1]
