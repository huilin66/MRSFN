_base_: 'C2Seg_BW.yml'

# Geographic-leakage experiment split (see tools/build_city_split_dataset.py):
#   train patches  <- Beijing full scene
#   val   patches  <- Wuhan   full scene
# so train/val share no spatial location. Dataset is generated by
#   python tools/build_city_split_dataset.py --output <abs/path>
# and C2SEG_BW_CITY_ROOT must point to that generated split root (see .env).
train_dataset:
  dataset_root: ${C2SEG_BW_CITY_ROOT}/train
  train_path:  ${C2SEG_BW_CITY_ROOT}/train.txt

val_dataset:
  dataset_root: ${C2SEG_BW_CITY_ROOT}/val
  val_path:  ${C2SEG_BW_CITY_ROOT}/val.txt
