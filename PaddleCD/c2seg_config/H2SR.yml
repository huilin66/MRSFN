# WHU-H2SR-MT supplementary dataset.
# 128x128 patches built by tools/h2sr_tools.py; block-wise 90.1/9.9 split
# (2,281 train / 250 val, block 8 held out).
# 100 epochs = floor(2281 / 8) = 285 iters/epoch -> 28,500 iters at batch 8.
#
# msi/ contains a 10-channel temporal-median composite of the 31 Sentinel-2
# dates: B4, B3, B2, B8, B5, B6, B7, B8a, B11, B12.  The first four channels
# are RGB+NIR; the remaining six occupy the SAR slots of the 4B/HighDAN models.  They
# are Sentinel-2 MSI bands, not true SAR.
# Normalize2 statistics are computed over train + val with mask=none:
#   python tools/h2sr_tools.py stats --msi --lists train.txt val.txt

