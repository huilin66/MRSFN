_base_: 'C2Seg_BW.yml'

# Geographic-leakage experiment split (see tools/build_city_split_dataset.py):
#   train patches  <- Wuhan   full scene
#   val   patches  <- Beijing full scene
# so train/val share no spatial location. Dataset is generated by
#   python tools/build_city_split_dataset.py --output <abs/path>
# and C2SEG_BW_CITY_ROOT must point to that generated split root (see .env).
train_dataset:
  dataset_root: ${C2SEG_BW_CITY_WB_ROOT}/train
  train_path:  ${C2SEG_BW_CITY_WB_ROOT}/train.txt

val_dataset:
  dataset_root: ${C2SEG_BW_CITY_WB_ROOT}/val
  val_path:  ${C2SEG_BW_CITY_WB_ROOT}/val.txt

# The reversed city split has ~850 training patches (~53 full batches at
# batch_size 16) — about 0.46x the forward split's 1,855 — because the Wuhan
# train scene is smaller than Beijing's.  To compare the two geographic
# directions at the SAME ~100 epochs (not the same raw iters), iters is scaled
# down from the forward 11500 (which would be ~217 epochs here and overfit the
# smaller train set).  lr step_size and save_interval are scaled to keep the
# same per-epoch LR-decay and snapshot cadence.  NOTE: calibrated to the
# inferred Wuhan count (850); re-check against the generated train.txt line
# count after build_city_split_dataset.py --split train_W_val_B.
iters: 5300
save_interval: 106

lr_scheduler:
  step_size: 660
