_base_: 'C2Seg_BW.yml'

# Geographic-leakage experiment split (see tools/build_city_split_dataset.py):
#   train patches  <- Wuhan   full scene
#   val   patches  <- Beijing full scene
# so train/val share no spatial location. Dataset is generated by
#   python tools/build_city_split_dataset.py --output <abs/path>
# and C2SEG_BW_CITY_ROOT must point to that generated split root (see .env).
train_dataset:
  dataset_root: ${C2SEG_BW_CITY_WB_ROOT}/train
  train_path:  ${C2SEG_BW_CITY_WB_ROOT}/train.txt

val_dataset:
  dataset_root: ${C2SEG_BW_CITY_WB_ROOT}/val
  val_path:  ${C2SEG_BW_CITY_WB_ROOT}/val.txt

# The reversed city split has 850 training patches (~53.125 full batches at
# batch_size 16) — about 0.46x the forward split's 1,855 — because the Wuhan
# train scene is smaller than Beijing's (val therefore becomes 1,855 patches).
# To compare the two geographic directions at the SAME ~100 epochs (the forward
# 11500 iters would be ~217 epochs here and overfit the smaller train set), the
# values below are scaled from 850/16 = 53.125 iters per epoch:
#   iters        = round(100  * 53.125) = 5313
#   save_interval= round(2    * 53.125) = 106   (snapshot ~every 2 epochs)
#   step_size    = round(12.5 * 53.125) = 664   (LR halves every ~12.5 epochs)
# keeping the same epoch-wise LR-decay and snapshot cadence as the forward split.
iters: 5313
save_interval: 106

lr_scheduler:
  step_size: 664
