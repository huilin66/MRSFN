_base_: 'H2SR.yml'

# CMX baseline with two MiT-B4 streams: 10 MSI channels and 249 HSI bands.
model:
  type: CMX
  backbone:
    type: CMXBackbone
    in_channels1: 10
    in_channels2: 249
    backbone: mit_b4
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/backbone/mix_vision_transformer_b4.tar.gz
  embedding_dim: 768
  dropout_ratio: 0.1
  align_corners: false
  num_classes: 8
