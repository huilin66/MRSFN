_base_: 'MDAS.yml'

# CMX baseline with two MiT-B4 streams: six MSI/SAR channels and 242 HSI
# channels, matching the MDAS 64x64 patch layout.
model:
  type: CMX
  backbone:
    type: CMXBackbone
    in_channels1: 6
    in_channels2: 242
    backbone: mit_b4
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/backbone/mix_vision_transformer_b4.tar.gz
  embedding_dim: 768
  dropout_ratio: 0.1
  align_corners: false
  num_classes: 14
